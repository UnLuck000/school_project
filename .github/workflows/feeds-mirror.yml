# Зеркало баз abuse.ch (tools/feeds_mirror.py): раз в сутки скачивает MalwareBazaar, ThreatFox,
# URLhaus (по ключу) и Feodo, SSLBL, JA3 и кладёт их в отдельную ветку «feeds» этого
# репозитория (не в выпуски: пользователю в «Releases» они не нужны). Программа (updater.py)
# качает их с raw.githubusercontent.com без ключа.
#
# Настройка (один раз): Settings → Secrets and variables → Actions → New repository secret,
# имя ABUSECH_AUTH_KEY, значение — ключ abuse.ch. Сменить ключ — поменять этот секрет.
# Запустить вручную: Actions → «Зеркало баз» → Run workflow.
# Ветка «feeds» каждый раз записывается заново одним коммитом (история не копится).
name: Зеркало баз

on:
  schedule:
    - cron: "17 2 * * *"   # раз в сутки, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: write          # запись ветки feeds

concurrency:
  group: feeds-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/feeds_mirror.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Скачать источники
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: python tools/feeds_mirror.py out

      # до 14.11.2026 (вечер) зеркало было выпуском «feeds»: выпуск и метка с тем же именем, что у
      # ветки, не нужны (программа берёт refs/heads/feeds)
      - name: Убрать прежний выпуск feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete feeds --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true

      - name: Записать в ветку feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd out
          git init -q -b feeds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Базы $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" feeds:refs/heads/feeds
